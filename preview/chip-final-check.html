<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @keyframes dsh-balance-wave{0%,100%{color:var(--g)}30%{color:#d9822b}60%{color:#e5534b}}
  @keyframes dsh-balance-clock{0%{transform:rotate(0deg)}40%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
  @keyframes dsh-balance-clock-pop{0%,100%{transform:scale(1)}30%{transform:scale(1.14)}45%{transform:scale(1)}}
  :root { --g: #2fbfa0; }
  body { background:#131415; font:12px/1.4 'Segoe UI', system-ui, sans-serif; padding:26px; width:420px; color:#8b8e94; }
  .row { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .chip { display:inline-flex; align-items:center; gap:6px; }
  .logo { width:14px; height:14px; border-radius:50%; background:conic-gradient(from 210deg,#4d6bfe,#7fd3ff,#4d6bfe); }
  .dot { width:8px; height:8px; border-radius:50%; }
  .pill { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; padding:0 7px; border-radius:999px; white-space:nowrap; }
  .teal { color:#2fbfa0; background:color-mix(in srgb,#2fbfa0 14%,transparent); border:0.5px solid color-mix(in srgb,#2fbfa0 38%,transparent); }
  .red { color:#e5534b; background:color-mix(in srgb,#e5534b 14%,transparent); border:0.5px solid color-mix(in srgb,#e5534b 38%,transparent); }
  .hand { transform-origin:6px 6px; animation:dsh-balance-clock 3.6s cubic-bezier(0.65,0,0.35,1) infinite; }
  .dial { overflow:visible; animation:dsh-balance-clock-pop 3.6s ease-in-out infinite; }
  .wave { animation:dsh-balance-wave 1.6s ease-in-out infinite; }
  .note { font-size:11px; color:#6e7177; }
</style>
</head>
<body>
  <div class="row">
    <span class="chip"><span class="logo"></span>$11.94<span class="dot" style="background:#e5534b"></span>
      <span class="pill teal"><svg class="dial" width="11" height="11" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.55"/><g class="hand"><line x1="6" y1="6" x2="6" y2="2.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></g></svg>1h 22m</span>
    </span>
    <span class="note">peak — teal relief pill, sweeping clock</span>
  </div>
  <div class="row">
    <span class="chip"><span class="logo"></span>$11.94<span class="dot" style="background:#4cb782"></span>
      <span class="pill red"><svg class="dial" width="11" height="11" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.55"/><g class="hand"><line x1="6" y1="6" x2="6" y2="2.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></g></svg>45m</span>
    </span>
    <span class="note">off-peak last hour — red warning pill</span>
  </div>
  <div class="row">
    <span class="chip"><span class="logo"></span>$11.94<span class="dot" style="background:#e5534b"></span>
      <span class="pill teal"><svg class="dial" width="11" height="11" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.55"/><g class="hand"><line x1="6" y1="6" x2="6" y2="2.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></g></svg><span class="wave">3m</span></span>
    </span>
    <span class="note">under 5 min — text waves green→amber→red</span>
  </div>
</body>
</html>
